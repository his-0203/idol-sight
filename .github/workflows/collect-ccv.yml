name: collect-ccv
on:
  schedule:
    # 실측(2026-06-09/10): GitHub 이 단일 tick 도 ~2.5–3h 지연시켜 윈도우가
    # KST 21:25+ 에야 시작 → 이른 저녁(OWIS 19시대) 방송을 통째로 놓침.
    # 두 트리거 + concurrency 직렬화로 보강 — 1차가 제때면 15:45~20:15 커버 후
    # 2차가 큐에서 이어받아 ~00:45 까지, 둘 다 ~3h 지연이면 18:45~03:45 연속.
    # 1차가 중간 크래시해도(06-09 러너 사망 사례) 2차가 잔여 저녁 윈도우를 백필.
    - cron: "45 6 * * *"   # KST 15:45 nominal — 1st window
    - cron: "45 9 * * *"   # KST 18:45 nominal — 2nd window (queued behind 1st)
  workflow_dispatch:

concurrency:
  group: collect-ccv
  cancel-in-progress: false

jobs:
  ccv:
    runs-on: ubuntu-latest
    timeout-minutes: 290    # ~4.8h ceiling; the loop self-terminates at ~4.5h
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - name: collect-ccv (self-loop, sample every 5 min for ~4.5h from actual start)
        working-directory: worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:   ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          YT_API_KEY:    ${{ secrets.YT_API_KEY }}
        run: |
          # GitHub silently drops/delays `schedule` ticks under load, so instead of
          # a dense cron (*/5) we trigger sparsely and drive the cadence ourselves
          # with sleep. Two daily triggers (KST 15:45 / 18:45 nominal) serialize via
          # the concurrency group; each run loops 4.5h from its actual start, so the
          # pair covers the 19–23 broadcast block even when GitHub delays ticks ~3h.
          # CCV is ephemeral (readable only while live) — a sample must overlap the
          # live. Overlapping samples are harmless (UPSERT, quota ~1 unit/sample).
          end=$(( $(date +%s) + 4 * 3600 + 1800 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$((n + 1))
            echo "::group::sample #$n @ $(date -u +%H:%M:%SZ)"
            uv run python -m idol_sight collect-ccv || echo "WARN: sample #$n failed (continuing)"
            echo "::endgroup::"
            sleep 300
          done
          echo "collect-ccv self-loop done: $n samples attempted"
      - name: notify on failure
        if: failure()
        working-directory: worker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: uv run python -m idol_sight notify-fail --job collect-ccv
