name: challenge-scan
on:
  schedule:
    # 월요일 KST 10:00 (UTC 01:00) — 주초 트렌드 정리.
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python -m idol_sight challenge-scan
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY }}
      - if: failure()
        run: uv run python -m idol_sight notify-fail --job 'challenge-scan'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
