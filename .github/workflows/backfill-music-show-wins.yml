name: backfill-music-show-wins
on:
  schedule:
    # Sunday 23:00 UTC = Monday 08:00 KST. analyze-weekly (Mon 00:00 UTC
    # = 09:00 KST) 의 1시간 전에 실행되어 health_score 계산이 최신 음방
    # 1위 confirmed count 를 read 하도록 anchor.
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      group:
        description: 'Single group_key (plave|skinz|bdawn|wegosix|owis|myrakl). Default = all 6.'
        required: false
      dry_run:
        description: 'true|false — true 면 LLM 호출만, D1 쓰기 안 함. (default: false)'
        required: false
        default: 'false'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run scrapling install
        working-directory: worker
      - name: Run backfill
        working-directory: worker
        run: |
          ARGS=""
          if [[ -n "${{ inputs.group }}" ]]; then
            ARGS="$ARGS --group ${{ inputs.group }}"
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run python -m idol_sight backfill-music-show-wins $ARGS
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail --job 'backfill-music-show-wins'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
