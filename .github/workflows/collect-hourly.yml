name: collect-hourly
# Despite the legacy file name "collect-hourly", the schedule is now
# twice-daily at KST 09:05 / 21:05 (UTC 00:05 / 12:05). The naver
# collector this workflow drives is cheap, but 24×/day was producing
# diminishing returns relative to the operator's actual review
# cadence (morning + evening). File renaming is deferred — cron-only
# change keeps history intact and existing dispatches working.
on:
  schedule:
    - cron: '5 0,12 * * *'
  workflow_dispatch:
    inputs:
      groups:
        description: 'comma-separated keys or "all"'
        default: 'all'

jobs:
  collect:
    strategy:
      fail-fast: false
      # max-parallel halved from 4 → 2: 9 simultaneous D1 callers were
      # tripping rate-limit windows (1/9 jobs would still time out even
      # with the d1.py retry+jitter armor). Total runtime grows from
      # ~3 → ~5min, well inside the 10min timeout.
      max-parallel: 2
      matrix:
        group:  [plave, isedol, stellive, skinz, myrakl, miiwan, owis, bdawn, wegosix, uryael]
        source: [naver]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - run: |
          uv run python -m idol_sight collect \
            --source ${{ matrix.source }} \
            --group  ${{ matrix.group }}
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail \
            --job '${{ matrix.source }}:${{ matrix.group }}'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  # aggregate step removed — was running 2×/day after each collect-hourly
  # firing and producing redundant D1 work alongside collect-6h and
  # collect-daily aggregates. Aggregation is now consolidated to the
  # collect-daily run (21:30 KST) + the melon-chart sandwich (06:00 KST).
  # Naver counts still flow into the underlying tables every fire; the
  # dashboard surfacing those counts just refreshes once daily instead
  # of twice. (See ci: 2026-05-08 commit.)
