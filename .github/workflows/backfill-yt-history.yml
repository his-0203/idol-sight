name: backfill-yt-history
# One-shot recovery operation. NOT scheduled — every snapshot the
# regular collectors emit going forward is real data; the backfill
# exists to fill the gap *before* collection started for groups
# debuted years before the dashboard came online (PLAVE 2023,
# ISEDOL 2021, STELLIVE 2023). Re-running is safe (ON CONFLICT DO
# NOTHING) but pointless after the first successful pass.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: worker

      - name: Run backfill-yt-history
        working-directory: worker
        env:
          CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:      ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: uv run python -m idol_sight backfill-yt-history
