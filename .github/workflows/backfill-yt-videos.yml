name: backfill-yt-videos
# One-shot full-history walk per group. Matrix per-group so a single
# group's timeout doesn't block the others. Default freshness filter in
# the CLI skips groups backfilled within 7 days; --force/checkbox bypasses.
#
# 2026-08-22: schedule 추가. 그 전까지 workflow_dispatch 전용이라, 새 그룹을
# 온보딩하면(migration 시드) last_backfilled_at 이 NULL 로 남고 health-check 가
# `backfill:<key>: never backfilled` 를 하루 2회 무기한 반복했다 —
# hollin/begritz(0104, 07-16 시드) 가 마지막 수동 실행(06-04) 이후 방치된 사례.
# 스케줄 경로는 --only-missing 으로 *한 번도 안 된 그룹만* 잡아, 전체 재-walk
# (YouTube 쿼터 폭증) 없이 신규 그룹을 자동 치유한다. 치유할 그룹이 없으면
# setup 이 [] 를 emit 하고 matrix job 자체가 skip 된다(주간 비용 ≈ setup 1회).
on:
  schedule:
    # 매주 월 UTC 03:30 (KST 12:30). collect-daily(UTC 12:30)/health-check
    # (UTC 01:00·13:00) 과 겹치지 않는 시간대 — D1 경합·false-positive 회피.
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      group:
        description: 'Single group key (e.g. isedol) — or "all" for every group'
        default: 'all'
        required: false
      force:
        description: 'Skip freshness filter (walk all targets)'
        type: boolean
        default: false
      only_missing:
        description: 'Backfill only groups never backfilled (last_backfilled_at IS NULL)'
        type: boolean
        default: false

jobs:
  # group / force / only_missing 을 받아 D1 의 last_backfilled_at 을 조회해
  # 대상 그룹만 JSON 배열로 emit.
  # 'all' / 공백 + force=false → 7d 이내 backfill 된 그룹은 skip.
  # 'all' + force=true        → KNOWN_GROUPS 전체.
  # only_missing=true         → 한 번도 안 된(NULL) 그룹만. 최협 필터라
  #                             force/fresh-days 보다 우선(schedule 기본값).
  # 특정 그룹                  → 해당 1개만 (필터 전부 무시 — 명시적 의도).
  setup:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - id: matrix
        working-directory: worker
        env:
          # backfill-targets 는 D1 read-only. DISCORD_WEBHOOK 등 알림 관련
          # secret 은 의도적으로 제외 (v1.3, 2026-05-13~). Settings.discord_webhook
          # 이 옵셔널로 바뀌어 webhook 미설정 시 None 으로 로드됨.
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          # schedule 트리거에선 inputs 컨텍스트가 비어 있어 group='' → 'all',
          # force/only_missing 은 false 로 떨어진다. 자가치유는 event_name 으로 켠다.
          GROUP_INPUT:  ${{ inputs.group }}
          FORCE:        ${{ inputs.force == true }}
          ONLY_MISSING: ${{ github.event_name == 'schedule' || inputs.only_missing == true }}
        run: |
          args=(--group "${GROUP_INPUT:-all}")
          # `[ ... ] && args+=(...)` 는 test 실패 시 종료코드 1 → bash -e 로
          # 스텝이 죽는다. if 문으로 쓴다.
          if [ "$ONLY_MISSING" = "true" ]; then args+=(--only-missing); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          groups=$(uv run python -m idol_sight backfill-targets "${args[@]}")
          echo "Selected groups: $groups (only_missing=$ONLY_MISSING force=$FORCE)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  backfill:
    needs: setup
    if: ${{ needs.setup.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      # collect-hourly/daily와 동일 패턴. D1 _load_group 의 cold-start
      # 429 (Too Many Requests) 를 회피하려면 동시 3개 이하가 안전.
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(needs.setup.outputs.groups) }}
    # 그룹당 60분. stellive 의 멤버 솔로 채널 합산 worst case 도 ~27분 →
    # 2배 여유. max-parallel=3 동시 실행 시 네트워크 경합으로 시간이
    # 늘어나는 경우까지 흡수. 단일 그룹 timeout 이 다른 8개 job 에
    # 영향 안 함.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - name: Backfill ${{ matrix.group }}
        run: |
          uv run python -m idol_sight backfill-yt-videos \
            --group ${{ matrix.group }} \
            ${{ inputs.force == true && '--force' || '' }}
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail --job 'backfill:${{ matrix.group }}'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
