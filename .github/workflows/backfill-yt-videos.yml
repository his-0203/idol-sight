name: backfill-yt-videos
# One-shot full-history walk of every active group's main + member YouTube
# channels. Use after schema/seed corrections (e.g. channel_id 정정) or
# whenever a new member channel is added. Daily cron (collect-daily)
# only tops up the latest 50 per channel; this dispatcher pages through
# every video the channel ever posted via playlistItems.list.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Single group key (e.g. isedol) — or "all" for every group'
        default: 'all'
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - name: Run backfill (scoped or all)
        run: |
          if [ "${{ inputs.group }}" = "all" ] || [ -z "${{ inputs.group }}" ]; then
            uv run python -m idol_sight backfill-yt-videos
          else
            uv run python -m idol_sight backfill-yt-videos --group ${{ inputs.group }}
          fi
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail --job 'backfill-yt-videos'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
