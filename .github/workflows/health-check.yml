name: health-check
# Twice daily at KST 10:00 / 22:00 (UTC 01:00 / 13:00) — collect-daily가
# KST 21:30(UTC 12:30)에 시작해 평균 5~10분 + GitHub Actions peak 지연
# 최대 ~30분이라 안전하게 +30~40분 offset. 그 전엔 collect-daily가 진행
# 중이라 audit이 false-positive 알람 발사 (2026-05-05 사건).
on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run python -m idol_sight health-check
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
