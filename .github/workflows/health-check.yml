name: health-check
# Twice daily at KST 09:30 / 21:30 (UTC 00:30 / 12:30) — between
# collect-6h (:15) and alerts (:45). 24×/day was wasteful: the
# audit only fires Discord pings when something is genuinely stale,
# and stale collectors stay stale across hours.
on:
  schedule:
    - cron: '30 0,12 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run python -m idol_sight health-check
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
