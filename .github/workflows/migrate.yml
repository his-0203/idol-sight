name: refresh-debut-health-once
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Production only; one-off debut health refresh"
        default: remote
        required: true
        type: choice
        options: [remote]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Refresh only BTHD and WE GO-6 existing health rows
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: uv run python scripts/refresh_debut_health_once.py
