name: collect-daily
on:
  schedule:
    # Once daily at KST 21:30 (UTC 12:30). Aligned with the evening
    # collect-hourly/6h batch so channel-stats + youtube refresh
    # land alongside the rest of the day's data and the operator
    # sees a coherent snapshot during their evening review.
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  collect:
    strategy:
      fail-fast: false
      # 4 → 2: collect-hourly와 동일 패턴 (37fa4de). 18 job 중 4개가
      # cold-start 시 동시에 D1 _load_group 을 hit → 429 Too Many Requests
      # 가 isedol+youtube 같은 fan-out 큰 job 에서 retry 6×0.5s+jitter 도
      # 못 풀고 떨어졌다. 결과적으로 `youtube:isedol` last_success_at 이
      # 24h+ 정체되어 health-check 가 false-positive 알람 발사
      # (25630615918, 25602874657, 25560827930, 25504489107). 2로 낮추면
      # 9 batch × ~60s = ~9min, 20min timeout 안에 여유 있음.
      max-parallel: 2
      matrix:
        group:  [plave, isedol, stellive, skinz, myrakl, miiwan, owis, bdawn, wegosix, uryael, bthd]
        source: [channel-stats, youtube]
    runs-on: ubuntu-latest
    # 15 → 20 min: ISEDOL/STELLIVE youtube collector가 멤버 솔로 채널까지
    # 합산하느라 GitHub runner peak 시간대(KST 21~23시)에 15분 hit 발생.
    # 2026-05-05 사건: 5개 그룹이 cancelled (timeout) → health-check이
    # 24h 후 false-positive 알람 발사. 20분이면 worst-case ISEDOL
    # 멤버 6채널 + STELLIVE 10채널도 여유.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - run: |
          uv run python -m idol_sight collect \
            --source ${{ matrix.source }} \
            --group  ${{ matrix.group }}
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail \
            --job '${{ matrix.source }}:${{ matrix.group }}'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  aggregate:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    # V2.19.1: aggregate(snap) -> melon-chart -> aggregate(snap) sandwich
    # so the daily health score recompute reflects today's chart data
    # instead of lagging by a day. The pinned snapshot_at keeps both
    # aggregate runs targeting the same agg_summary row, so the second
    # one ON CONFLICTs and COALESCE preserves the melon UPDATE before
    # health scores recompute.
    #
    # 10 → 25 min (2026-05-12): aggregate 단일 실행이 velocity 단계
    # (303 row × 직렬 D1 round-trip) 만으로 4–5분 소요 → sandwich 패턴
    # 전체는 9~11분에 도달. 10분 budget 안에서 run #5,#6,#7,#8 모두
    # 2nd aggregate가 cancelled. melon-chart.yml 워크플로(동일 sandwich
    # 패턴)는 같은 이유로 이미 25min 사용 중이므로 동일 budget으로
    # 정렬. 후속 최적화(2nd aggregate --skip-derived)는 별도 PR로.
    #
    # 25 → 90 min (V3.1, 2026-05-25): organicity 전 영상 적용 후
    # build_video_organicity 가 1,231개 → 13,990개 (×11배) UPSERT, 직렬
    # D1 round-trip 으로 ~80분 소요라 90분 여유.
    #
    # 90 → 20 min (2026-06-06): d1.py batch() 진짜 chunked batch 도입 후
    # organicity write 가 ~14.7k POST → ~150 요청으로 압축 → aggregate
    # 가 9분(측정값, run 27024410564)으로 급감. 20분이면 sandwich 전체 +
    # 향후 증가분 여유 + hang 조기 감지. (batch 형식 거부 시 sequential
    # fallback 으로 ~80분 회귀 가능성은 있으나, prod 검증 완료라 정상 경로.)
    timeout-minutes: 20
    defaults: { run: { working-directory: worker } }
    env:
      CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
      CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run scrapling install

      - name: Pin snapshot_at for this run
        id: snap
        working-directory: .
        run: echo "snap=$(date -u +%Y-%m-%dT%H:00:00Z)" >> "$GITHUB_OUTPUT"

      - name: Aggregate (build today's snapshot, melon NULL on first pass)
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }}

      - name: Melon chart (UPDATE today's snapshot with peak/depth)
        run: uv run python -m idol_sight melon-chart

      - name: Aggregate again (COALESCE preserves melon, recomputes health scores)
        # --skip-derived: stages 2~4 (combined/velocity/reactivity) don't
        # read melon fields, so re-running them after melon-chart only
        # burns the job budget. velocity alone is ~4min/run on the runner.
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }} --skip-derived

  # 미완소년 소유자 OAuth(YouTube Analytics) — 매트릭스(공개 API 키) 와 별개의
  # 단일 job. miiwan 채널에만 적용되며 MIIWAN_YT_OAUTH_* 시크릿이 없으면
  # 커맨드가 스스로 skip 한다 (다른 그룹/포크에서 실패하지 않음). 공개 수집과
  # 독립이라 collect 매트릭스에 의존하지 않는다.
  miiwan-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python -m idol_sight youtube-analytics --group miiwan
        env:
          CF_ACCOUNT_ID:                 ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:                   ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:                  ${{ secrets.CF_API_TOKEN }}
          MIIWAN_YT_OAUTH_CLIENT_ID:     ${{ secrets.MIIWAN_YT_OAUTH_CLIENT_ID }}
          MIIWAN_YT_OAUTH_CLIENT_SECRET: ${{ secrets.MIIWAN_YT_OAUTH_CLIENT_SECRET }}
          MIIWAN_YT_OAUTH_REFRESH_TOKEN: ${{ secrets.MIIWAN_YT_OAUTH_REFRESH_TOKEN }}
      - if: failure()
        run: uv run python -m idol_sight notify-fail --job 'youtube-analytics:miiwan'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
