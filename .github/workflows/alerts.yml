name: alerts
on:
  schedule:
    # Twice daily at KST 09:45 / 21:45 (UTC 00:45 / 12:45). Lined up
    # AFTER the collect-hourly + collect-6h + health-check stages so
    # alerts evaluate fresh aggregates. The dedup table prevents the
    # cadence change from re-firing already-handled milestones.
    - cron: '45 0,12 * * *'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run python -m idol_sight alerts-run
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      # The alerting layer must report its own death — without this a crashed
      # alerts-run (D1 error, expired token, regression) fails silently and the
      # operator loses the exact signal this job exists to provide.
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail \
            --job 'alerts:alerts-run'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
