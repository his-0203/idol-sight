name: collect-6h
# Legacy file name "collect-6h" — schedule is now KST 09:15 / 21:15
# (UTC 00:15 / 12:15). 15-min offset from collect-hourly so the
# DC/TheQoo/Instiz scrapers (Cloudflare-challenged, ~10s each)
# don't start while naver is still running. File rename deferred.
on:
  schedule:
    - cron: '15 0,12 * * *'
  workflow_dispatch:

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group:  [plave, isedol, stellive, skinz, myrakl, miiwan, owis, bdawn, wegosix]
        source: [dc, theqoo, instiz]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run scrapling install
        working-directory: worker
      - run: |
          uv run python -m idol_sight collect \
            --source ${{ matrix.source }} \
            --group  ${{ matrix.group }}
        working-directory: worker
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:     ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - if: failure()
        working-directory: worker
        run: |
          uv run python -m idol_sight notify-fail \
            --job '${{ matrix.source }}:${{ matrix.group }}'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  # aggregate step removed — was running 2×/day after each collect-6h
  # firing and producing redundant D1 work alongside collect-hourly and
  # collect-daily aggregates. Aggregation is now consolidated to the
  # collect-daily run (21:30 KST) + the melon-chart sandwich (06:00 KST).
  # DC/TheQoo/Instiz counts still flow into the underlying tables every
  # fire; the dashboard surfacing those counts just refreshes once daily
  # instead of twice. (See ci: 2026-05-08 commit.)
