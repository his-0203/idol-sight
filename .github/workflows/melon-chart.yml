name: melon-chart
on:
  schedule:
    # 18:00 UTC daily ≈ 03:00 KST. Melon's daily chart finalizes around
    # midnight KST; pulling at 03:00 gives the page time to settle and
    # avoids overlap with collect-daily (12:30 UTC) and external-cohort
    # (06:30 UTC).
    #
    # V2.19.1: this workflow now wraps the melon fetch with an
    # aggregate-melon-aggregate sandwich so health scores reflect the
    # fresh chart data. The pinned snapshot_at ensures both aggregate
    # runs target the same agg_summary row — the second one hits
    # ON CONFLICT, COALESCE preserves the melon UPDATE from the middle
    # step, and health scores recompute against the now-populated row.
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    env:
      CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DB_ID:      ${{ secrets.CF_D1_DB_ID }}
      CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run scrapling install

      - name: Pin snapshot_at for this run
        id: snap
        working-directory: .
        run: echo "snap=$(date -u +%Y-%m-%dT%H:00:00Z)" >> "$GITHUB_OUTPUT"

      - name: Aggregate (creates today's snapshot, melon NULL on first pass)
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }}

      - name: Run melon-chart (UPDATE today's snapshot with peak/depth)
        run: uv run python -m idol_sight melon-chart

      - name: Aggregate again (conflict + COALESCE preserves melon, recomputes health scores)
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }}

      - if: failure()
        run: uv run python -m idol_sight notify-fail --job 'melon-chart'
