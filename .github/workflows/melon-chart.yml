name: melon-chart
on:
  schedule:
    # 18:00 UTC daily ≈ 03:00 KST. Melon's daily chart finalizes around
    # midnight KST; pulling at 03:00 gives the page time to settle and
    # avoids overlap with collect-daily (08:30 UTC) and external-cohort
    # (06:30 UTC).
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
        working-directory: worker
      - run: uv run scrapling install
        working-directory: worker

      - name: Run melon-chart
        working-directory: worker
        env:
          CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID:      ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: uv run python -m idol_sight melon-chart

      - if: failure()
        working-directory: worker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: uv run python -m idol_sight notify-fail --job 'melon-chart'
