name: melon-chart
on:
  schedule:
    # 21:00 UTC daily = 06:00 KST. Moved from 03:00 KST (18:00 UTC) to
    # widen the gap from collect-daily (12:30 UTC ≈ 21:30 KST) and put
    # the run in the quiet morning window. The previous 03:00 KST slot
    # collided with the 10-min budget being too tight for the
    # aggregate-melon-aggregate sandwich (3 sequential D1-heavy steps).
    # 06:00 KST sits AFTER collect-daily/health-check finish and BEFORE
    # external-cohort (06:30 UTC ≈ 15:30 KST) starts.
    #
    # V2.19.1: this workflow wraps the melon fetch with an
    # aggregate-melon-aggregate sandwich so health scores reflect the
    # fresh chart data. The pinned snapshot_at ensures both aggregate
    # runs target the same agg_summary row — the second one hits
    # ON CONFLICT, COALESCE preserves the melon UPDATE from the middle
    # step, and health scores recompute against the now-populated row.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 10 → 25 min: aggregate alone now takes 5–10min on the runner
    # (sequential D1 round trips × hundreds of statements). Three
    # D1-heavy steps in this workflow (aggregate → melon → aggregate)
    # need a real budget — 10min was producing chronic timeouts.
    timeout-minutes: 25
    defaults: { run: { working-directory: worker } }
    env:
      CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DB_ID:      ${{ secrets.CF_D1_DB_ID }}
      CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run scrapling install

      - name: Pin snapshot_at for this run
        id: snap
        working-directory: .
        run: echo "snap=$(date -u +%Y-%m-%dT%H:00:00Z)" >> "$GITHUB_OUTPUT"

      - name: Aggregate (creates today's snapshot, melon NULL on first pass)
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }}

      - name: Run melon-chart (UPDATE today's snapshot with peak/depth)
        run: uv run python -m idol_sight melon-chart

      - name: Aggregate again (conflict + COALESCE preserves melon, recomputes health scores)
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }}

      - if: failure()
        run: uv run python -m idol_sight notify-fail --job 'melon-chart'
