name: melon-chart
on:
  schedule:
    # 21:00 UTC daily = 06:00 KST. Moved from 03:00 KST (18:00 UTC) to
    # widen the gap from collect-daily (12:30 UTC ≈ 21:30 KST) and put
    # the run in the quiet morning window. The previous 03:00 KST slot
    # collided with the 10-min budget being too tight for the
    # aggregate-melon-aggregate sandwich (3 sequential D1-heavy steps).
    # 06:00 KST sits AFTER collect-daily/health-check finish.
    #
    # V2.19.1: this workflow wraps the melon fetch with an
    # aggregate-melon-aggregate sandwich so health scores reflect the
    # fresh chart data. The pinned snapshot_at ensures both aggregate
    # runs target the same agg_summary row — the second one hits
    # ON CONFLICT, COALESCE preserves the melon UPDATE from the middle
    # step, and health scores recompute against the now-populated row.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 10 → 25 min: aggregate alone now takes 5–10min on the runner
    # (sequential D1 round trips × hundreds of statements). Three
    # D1-heavy steps in this workflow (aggregate → melon → aggregate)
    # need a real budget — 10min was producing chronic timeouts.
    timeout-minutes: 25
    defaults: { run: { working-directory: worker } }
    env:
      CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DB_ID:      ${{ secrets.CF_D1_DB_ID }}
      CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
      DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run scrapling install

      - name: Pin snapshot_at + chart_date for this run
        id: snap
        working-directory: .
        # snap = 현재 UTC hour (audit/debug용).
        # chart_date = "어제 KST" (멜론 일간차트가 표현하는 날짜).
        #   21:00 UTC cron 실행 시 KST = 익일 06:00이라
        #   "어제 KST" = UTC 같은 날짜와 일치 → date -u +%F.
        #   다른 시각 실행 시에도 collector의 default_chart_date_kst() 가
        #   알아서 처리하지만 idempotency를 위해 명시 전달.
        run: |
          echo "snap=$(date -u +%Y-%m-%dT%H:00:00Z)" >> "$GITHUB_OUTPUT"
          echo "chart_date=$(TZ=Asia/Seoul date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Aggregate (creates today's snapshot, melon NULL on first pass)
        # --skip-derived: V3.1(2026-05-25) organicity 전영상 적용 후 full
        # aggregate 가 25분 timeout 을 넘겨 5/25~ 매일 cancelled 됐다(첫
        # aggregate 단독 ~25min, melon/2nd 는 skipped). melon-chart 의 목적은
        # 멜론 fetch + health score 재계산이고, organicity/velocity/combined/
        # reactivity 는 collect-daily(21:30 KST)가 이미 매일 갱신한다.
        # melon-chart(06:00 KST, 익일) 사이 collect 가 없어 derived 재빌드는
        # 같은 데이터의 중복일 뿐 — agg_summary(stage 1, melon UPDATE 대상)는
        # skip-derived 와 무관하게 생성되므로 sandwich 는 온전하다.
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }} --skip-derived

      - name: Run melon-chart (UPDATE today's snapshot with peak/depth + INSERT entries)
        # V2.24: --chart-date 명시. snap은 fetch 시각, chart_date는
        # 일간차트 본래 날짜 (KST 어제).
        run: uv run python -m idol_sight melon-chart --snapshot-at ${{ steps.snap.outputs.snap }} --chart-date ${{ steps.snap.outputs.chart_date }}

      - name: Aggregate again (conflict + COALESCE preserves melon, recomputes health scores)
        # --skip-derived: stages 2~4 (combined/velocity/reactivity) don't
        # read melon fields, so re-running them after melon-chart only
        # burns the job budget. velocity alone is ~4min/run on the runner.
        run: uv run python -m idol_sight aggregate --snapshot-at ${{ steps.snap.outputs.snap }} --skip-derived

      - if: failure()
        run: uv run python -m idol_sight notify-fail --job 'melon-chart'
