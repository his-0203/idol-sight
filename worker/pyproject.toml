[project]
name = "idol-sight"
version = "0.1.0"
description = "IDOL-SIGHT worker — collectors and analysis for virtual idol BI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "scrapling[fetchers]>=0.4.7",
  "typer>=0.15",
  "google-genai>=0.8",
  "structlog>=24",
  "tenacity>=9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
  "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idol_sight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 픽스처/그룹 단위로 import 를 함수 사이에 두는 패턴 허용.
"tests/**" = ["E402"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
