<!--
  Fixture provenance: hand-constructed.

  Live fetch of https://www.hanteochart.com/?fc=albums&sub=weekly returned
  only a 1.4KB SPA shell (the chart is hydrated client-side via JS, so
  curl/`requests` cannot capture the rendered table). StealthyFetcher in
  production runs a real browser via Camoufox + waits for `network_idle`,
  so it can read the DOM after hydration.

  This fixture mirrors the post-hydration DOM shape documented in the
  plan (Plan 3 Task 3, Step 1) and reproduces three real chart entries
  the worker must match against seeded groups (PLAVE, STELLIVE, SKINZ),
  plus one extra entry (HYUKOH) that should NOT match any seeded group.

  Selectors used by collectors/hanteo.py:
    - .search_chart_year_top10_unit_box1 (row container)
    - .rank, .album_name, .artist_name, .sales (cells)
-->

<html lang="ko">

<body>
