    PLAVE minor gallery; the original 212 KB response was trimmed to a
    self-contained HTML document holding the gall_list table with four
    representative posts (mix of icon_pic / icon_txt entries, all under
    PLAVE so context_keywords filtering is not exercised).

    Selectors verified against this capture:
      - table.gall_list tbody tr.us-post   (post rows)
      - td.gall_tit a                       (title + href)
      - td.gall_count                       (views)
      - td.gall_recommend                   (likes / "추천")
      - td.gall_date[title]                 (full ISO 8601 datetime)

    Notice rows (data-type="icon_notice") and the survey/AD intro rows
    were excluded — they do not have data-no values that look like real
    posts and the title anchors point at javascript:; or external coupang
    redirects, so they would be filtered out by the collector anyway.
-->
